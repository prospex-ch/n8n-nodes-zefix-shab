# Publishes this package to npm with a provenance statement whenever a version
# tag is pushed. See https://docs.npmjs.com/generating-provenance-statements
#
# Setup, one of:
#
#   A. Trusted publishing (no secret to manage). On npmjs.com, open the package
#      settings, go to "Trusted Publisher", pick GitHub Actions and enter this
#      repository (prospex-ch/n8n-nodes-zefix-shab) with workflow file
#      publish.yml and an empty environment. Leave NPM_TOKEN unset.
#
#   B. Granular access token. On npmjs.com generate a token with read/write
#      access to this package, then add it in GitHub under Settings → Secrets
#      and variables → Actions as NPM_TOKEN.
#
# Release flow: run `npm run release` locally. It lints, builds, bumps the
# version, updates the changelog, commits, tags and pushes. The tag push starts
# this workflow, which lints and builds again and then runs
# `npm publish --provenance`.

name: Publish

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token that signs the provenance attestation
      # (and to authenticate with npm when trusted publishing is used).
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing and provenance need npm 11.5.1 or newer, which is
      # ahead of the version bundled with the current Node LTS.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Publish
        # Inside GitHub Actions, `n8n-node release` runs lint, build and then
        # `npm publish` with NPM_CONFIG_PROVENANCE=true.
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
